name: Build Windows

# Builds the Windows installer.
#   - Push a tag like `v0.1.0`  → creates a draft GitHub Release with the
#     installer attached (share that link with beta testers).
#   - Run manually (workflow_dispatch) → uploads the installer as a build
#     artifact you can download from the run, without cutting a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Build against the committed .sqlx cache instead of a live database.
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app + installer
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SQLX_OFFLINE: 'true'
        with:
          # Use the CI-only tauri script (the default `tauri` script carries
          # WSL-only env vars that don't parse on Windows).
          tauriScript: pnpm tauri:ci
          # On a tag build, cut a draft release with the installers attached.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Birdet ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: |
            Windows beta build.

            The installer is unsigned, so Windows SmartScreen will warn on first
            run — click **More info → Run anyway**.

      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: birdet-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
