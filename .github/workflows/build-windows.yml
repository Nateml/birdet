name: Build

# Builds the Windows + Linux installers.
#   - Push a tag like `v0.1.0`  → creates a draft GitHub Release with the
#     Windows (.exe) and Linux (.AppImage, .deb) bundles attached, plus a
#     merged latest.json for the in-app updater.
#   - Run manually (workflow_dispatch) → uploads the bundles as build artifacts
#     you can download from the run, without cutting a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Allow the workflow token to create a Release + upload assets on tag builds.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Build against the committed .sqlx cache instead of a live database.
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so the changelog step can diff against the
          # previous release tag.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the release notes from commit subjects since the previous tag.
      # These land in both the GitHub release body and `latest.json` (what the
      # in-app updater shows), so they must be generated at build time.
      - name: Generate release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $prev = git describe --tags --abbrev=0 "HEAD^" 2>$null
          if ($LASTEXITCODE -eq 0 -and $prev) {
            $log = git log "$prev..HEAD" --no-merges --pretty="- %s"
          } else {
            $log = git log --no-merges --pretty="- %s"
          }
          if (-not $log) { $log = "- Maintenance release." }
          $delim = "EOF_" + [System.Guid]::NewGuid().ToString("N")
          "body<<$delim" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $log           | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "$delim"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build app + installer
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SQLX_OFFLINE: 'true'
          # Updater signing. With these set, tauri-action signs the installer and
          # attaches a `latest.json` to the release (what the in-app updater reads).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Use the CI-only tauri script (the default `tauri` script carries
          # WSL-only env vars that don't parse on Windows).
          tauriScript: pnpm tauri:ci
          # On a tag build, cut a draft release with the installers attached.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Birdet ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: |
            ## What's changed

            ${{ steps.notes.outputs.body }}

            ---
            The installer is unsigned, so Windows SmartScreen will warn on first
            run — click **More info → Run anyway**.

      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: birdet-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    # Run after Windows so both jobs attach to the same release and tauri-action
    # merges each platform into a single `latest.json` (rather than racing on it).
    needs: windows
    env:
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app + bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SQLX_OFFLINE: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri:ci
          # The config targets NSIS (Windows); override to the Linux bundles.
          # AppImage is what the in-app updater self-updates; the .deb is a
          # manual-install extra.
          args: --bundles appimage deb
          # Same tag as the Windows job → assets land on the same draft release
          # and latest.json gains the linux platform entry.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Birdet ${{ github.ref_name }}
          releaseDraft: true

      - name: Upload Linux artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: birdet-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
