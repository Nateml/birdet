<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1c11"/>
      <stop offset="1" stop-color="#07100a"/>
    </linearGradient>
    <linearGradient id="bird" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6bf07a"/>
      <stop offset="1" stop-color="#3fce62"/>
    </linearGradient>
  </defs>

  <!-- rounded-square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="216" fill="url(#bg)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="210" fill="none" stroke="#52e876" stroke-opacity="0.12" stroke-width="4"/>

  <!-- songbird silhouette -->
  <g fill="url(#bird)">
    <!-- tail -->
    <path d="M300 560 L92 470 Q70 500 96 560 L120 620 Q150 700 250 690 Z"/>
    <!-- body -->
    <ellipse cx="512" cy="560" rx="230" ry="180"/>
    <!-- head -->
    <circle cx="672" cy="428" r="132"/>
    <!-- beak -->
    <path d="M792 402 L916 386 Q930 424 902 452 L788 470 Z"/>
  </g>

  <!-- wing (darker overlay for depth) -->
  <path d="M360 540 Q470 470 590 520 Q520 640 430 650 Q360 640 340 590 Z" fill="#1f9c48"/>

  <!-- eye -->
  <circle cx="706" cy="405" r="26" fill="#07100a"/>
  <circle cx="716" cy="397" r="8" fill="#c7f5d2"/>
</svg>
